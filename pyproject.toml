[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servellm"
version = "0.1.0"
description = "Self-hosted OpenAI-compatible LLM serving on vLLM with continuous batching: setup, config walkthrough and measured batching behaviour on a single T4"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/servellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
